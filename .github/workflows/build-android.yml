name: Build Ostadchi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v0.5.0
      - feature/profile-city-updates

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ostadchi source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::GitHub Actions secret SUPABASE_URL is missing."
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::GitHub Actions secret SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must start with https://"; exit 1 ;;
          esac
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY must be a Supabase publishable key."; exit 1 ;;
          esac

      - name: Get dependencies
        run: flutter pub get

      - name: Install image conversion dependency
        run: python -m pip install --upgrade Pillow

      - name: Convert selected icon to PNG
        run: |
          python - <<'PY'
          from PIL import Image
          image = Image.open('assets/icon/ostadchi_icon.jpg').convert('RGBA')
          image.save('assets/icon/ostadchi_icon.png', format='PNG', optimize=True)
          Image.open('assets/icon/ostadchi_icon.png').verify()
          PY

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ostadchi-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ostadchi-v0.5.3-build-${{ github.run_number }}
          name: Ostadchi Android v0.5.3 (Build ${{ github.run_number }})
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
