name: Build Ostadchi Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ostadchi_flutter_v0.3_build_ready.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract project archive
        run: |
          unzip -q ostadchi_flutter_v0.3_build_ready.zip -d .build_source
          test -f .build_source/ostadchi_flutter/pubspec.yaml
      - name: Apply startup configuration fixes
        working-directory: .build_source/ostadchi_flutter
        run: |
          cp "$GITHUB_WORKSPACE/ostadchi_flutter_fixes/lib/core/config/app_config.dart" lib/core/config/app_config.dart
          cp "$GITHUB_WORKSPACE/ostadchi_flutter_fixes/lib/main.dart" lib/main.dart
          cp "$GITHUB_WORKSPACE/ostadchi_flutter_fixes/test_widget_test.dart" test_widget_test.dart
      - name: Restore Android project scaffolding if missing
        working-directory: .build_source/ostadchi_flutter
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            flutter create --platforms=android --org com.ostadchi --project-name ostadchi .
          fi
      - name: Remove conflicting legacy Android Gradle files
        working-directory: .build_source/ostadchi_flutter
        run: |
          rm -f android/build.gradle android/app/build.gradle android/settings.gradle
      - name: Configure Gradle memory for release build
        working-directory: .build_source/ostadchi_flutter
        run: |
          if grep -q '^org.gradle.jvmargs=' android/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8/' android/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8' >> android/gradle.properties
          fi
          echo 'android.enableJetifier=false' >> android/gradle.properties
      - name: Get dependencies
        working-directory: .build_source/ostadchi_flutter
        run: flutter pub get
      - name: Fix Flutter SDK compatibility and analyze app source
        working-directory: .build_source/ostadchi_flutter
        run: |
          sed -i 's/CardTheme(/CardThemeData(/g' lib/core/theme/app_theme.dart
          flutter analyze lib
          flutter test
      - name: Build release APK
        working-directory: .build_source/ostadchi_flutter
        env:
          SUPABASE_URL: https://lvadrcplahdvfwrunkce.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_q14BdoqW6BBRrfGoGoyoUw_ig9AIHoc
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ostadchi-android-apk
          path: .build_source/ostadchi_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
