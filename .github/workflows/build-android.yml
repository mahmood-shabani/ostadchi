name: Build Ostadchi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v0.5.0
      - feature/profile-city-updates

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ostadchi source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate app and signing secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name secret is missing."; exit 1; fi
          done
          case "$SUPABASE_URL" in https://*) ;; *) echo "::error::SUPABASE_URL must start with https://"; exit 1;; esac
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "::error::Invalid Supabase publishable key."; exit 1;; esac

      - name: Configure permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/ostadchi-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../ostadchi-upload-key.jks
          EOF

      - name: Verify decoded keystore and store password
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s android/ostadchi-upload-key.jks || { echo "::error::Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."; exit 1; }
          keytool -list -keystore android/ostadchi-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore decoded successfully; store password and alias are valid."

      - name: Get dependencies
        run: flutter pub get

      - name: Install image conversion dependency
        run: python -m pip install --upgrade Pillow

      - name: Convert selected icon to PNG
        run: |
          python - <<'PY'
          from PIL import Image
          image = Image.open('assets/icon/ostadchi_icon.jpg').convert('RGBA')
          image.save('assets/icon/ostadchi_icon.png', format='PNG', optimize=True)
          Image.open('assets/icon/ostadchi_icon.png').verify()
          PY

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ostadchi-android-signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish signed APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ostadchi-v0.5.4-build-${{ github.run_number }}
          name: Ostadchi Android v0.5.4 (Build ${{ github.run_number }})
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
