import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("key.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.example.ostadchi"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    defaultConfig {
        applicationId "com.example.ostadchi"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
                storeFile file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (!signingPropertiesFile.exists()) {
                throw new GradleException("Android release signing is not configured. Add android/key.properties and upload-keystore.jks.")
            }
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}
