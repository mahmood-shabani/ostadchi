plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def signingKeystore = file("../ostadchi-upload-key.jks")

android {
    namespace "com.example.ostadchi"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    defaultConfig {
        applicationId "com.example.ostadchi"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (signingStorePassword && signingKeyPassword && signingKeyAlias && signingKeystore.exists()) {
                storeFile signingKeystore
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (!(signingStorePassword && signingKeyPassword && signingKeyAlias && signingKeystore.exists())) {
                throw new GradleException("Android release signing environment is incomplete or keystore file is missing.")
            }
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}
